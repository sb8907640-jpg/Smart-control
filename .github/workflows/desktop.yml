name: Desktop CI

on:
  push:
    branches: ["main"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    branches: ["main"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: desktop
        run: npm install --no-audit --no-fund
      - working-directory: desktop
        run: npm run check
      - working-directory: desktop
        run: npm run build:linux
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: smart-control-desktop-linux
          path: desktop/dist/*.AppImage
