name: Android APK Download

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK set to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - debug
          - release
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize Firebase config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        if: env.FIREBASE_GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Prepare secure release signing
        if: ${{ (inputs.build_type || 'all') == 'release' || (inputs.build_type || 'all') == 'all' }}
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is not configured."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/smart-control-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          {
            echo "SMARTCONTROL_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "SMARTCONTROL_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "SMARTCONTROL_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "SMARTCONTROL_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          SMARTCONTROL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SMARTCONTROL_GOOGLE_WEB_CLIENT_ID }}
          SMARTCONTROL_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SMARTCONTROL_API_BASE_URL }}
          BUILD_TYPE: ${{ inputs.build_type || 'all' }}
        run: |
          set -euo pipefail
          case "$BUILD_TYPE" in
            debug)
              gradle assembleOwnerDebug assembleLiteDebug assembleFullDebug                 -PSMARTCONTROL_GOOGLE_WEB_CLIENT_ID="$SMARTCONTROL_GOOGLE_WEB_CLIENT_ID"                 -PSMARTCONTROL_API_BASE_URL="$SMARTCONTROL_API_BASE_URL"
              ;;
            release)
              gradle assembleOwnerRelease assembleLiteRelease assembleFullRelease                 -PSMARTCONTROL_GOOGLE_WEB_CLIENT_ID="$SMARTCONTROL_GOOGLE_WEB_CLIENT_ID"                 -PSMARTCONTROL_API_BASE_URL="$SMARTCONTROL_API_BASE_URL"
              ;;
            all)
              gradle assembleOwnerDebug assembleLiteDebug assembleFullDebug                 assembleOwnerRelease assembleLiteRelease assembleFullRelease                 -PSMARTCONTROL_GOOGLE_WEB_CLIENT_ID="$SMARTCONTROL_GOOGLE_WEB_CLIENT_ID"                 -PSMARTCONTROL_API_BASE_URL="$SMARTCONTROL_API_BASE_URL"
              ;;
            *)
              echo "Unsupported BUILD_TYPE=$BUILD_TYPE" >&2
              exit 2
              ;;
          esac

      - name: Verify release APK signatures
        if: ${{ (inputs.build_type || 'all') == 'release' || (inputs.build_type || 'all') == 'all' }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for variant in owner lite full; do
            APK="app/build/outputs/apk/$variant/release/app-$variant-release.apk"
            test -s "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

      - name: Verify APK outputs are present
        run: |
          set -euo pipefail
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          find app/build/outputs/apk -type f -name '*.apk' -print | sort

      - name: Upload APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: smart-control-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
