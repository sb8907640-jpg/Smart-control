name: Production Readiness Gate

on:
  push:
    branches: ["main"]
    paths: ["app/**", "backend/**", "contracts/**", "desktop/**", "functions/**", "ios/**", "web/**", "scripts/**", ".github/workflows/production-readiness.yml"]
  pull_request:
    branches: ["main"]
    paths: ["app/**", "backend/**", "desktop/**", "functions/**", "ios/**", "web/**", "scripts/**", ".github/workflows/production-readiness.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      SMARTCONTROL_DATA_REGION: ${{ secrets.SMARTCONTROL_DATA_REGION }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_SMARTCONTROL_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SMARTCONTROL_API_BASE_URL }}
      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      SMARTCONTROL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SMARTCONTROL_GOOGLE_WEB_CLIENT_ID }}
      SMARTCONTROL_TURN_URLS: ${{ secrets.SMARTCONTROL_TURN_URLS }}
      SMARTCONTROL_TURN_USERNAME: ${{ secrets.SMARTCONTROL_TURN_USERNAME }}
      SMARTCONTROL_TURN_CREDENTIAL: ${{ secrets.SMARTCONTROL_TURN_CREDENTIAL }}
      SMARTCONTROL_IOS_FIREBASE_CONFIG: ${{ secrets.SMARTCONTROL_IOS_FIREBASE_CONFIG }}
      SMARTCONTROL_AUDIT_RPC_URL: ${{ secrets.SMARTCONTROL_AUDIT_RPC_URL }}
      SMARTCONTROL_AUDIT_PRIVATE_KEY: ${{ secrets.SMARTCONTROL_AUDIT_PRIVATE_KEY }}
      SMARTCONTROL_AUDIT_CONTRACT_ADDRESS: ${{ secrets.SMARTCONTROL_AUDIT_CONTRACT_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Verify final master specification
        run: node scripts/master-spec-verify.js

      - name: Verify 11-step Owner + Receiver flow
        run: node scripts/verify-11-step-flow.js
      - name: Verify Smart Auto-Link + Persistent Connection
        run: node scripts/verify-smart-autolink-persistent.js

      - name: Enforce production configuration gate
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: node scripts/production-readiness-preflight.js

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: smart_control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_control_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smart_control_test
          PG_SSL: "false"
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run migrate
          npm run verify:schema
          npm run verify:api
          npm test

  blockchain-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Compile audit anchor contract
        run: npx --yes solc@0.8.30 --bin contracts/AuditAnchor.sol

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Validate Firebase Functions
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check billing.js
          node --check blockchain-audit.js
          node --test blockchain-audit.test.js
          node -e "const c=require('./spec/masterCatalog'); if(c.TABLES.length < 42 || c.API.length < 60) process.exit(1)"

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_SMARTCONTROL_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SMARTCONTROL_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build:linux

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Materialize Firebase config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        if: env.FIREBASE_GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Build and test Android
        env:
          SMARTCONTROL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SMARTCONTROL_GOOGLE_WEB_CLIENT_ID }}
          SMARTCONTROL_TURN_URLS: ${{ secrets.SMARTCONTROL_TURN_URLS }}
          SMARTCONTROL_TURN_USERNAME: ${{ secrets.SMARTCONTROL_TURN_USERNAME }}
          SMARTCONTROL_TURN_CREDENTIAL: ${{ secrets.SMARTCONTROL_TURN_CREDENTIAL }}
          SMARTCONTROL_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SMARTCONTROL_API_BASE_URL }}
        run: gradle test assembleOwnerDebug assembleLiteDebug assembleFullDebug -PSMARTCONTROL_GOOGLE_WEB_CLIENT_ID="$SMARTCONTROL_GOOGLE_WEB_CLIENT_ID" -PSMARTCONTROL_TURN_URLS="$SMARTCONTROL_TURN_URLS" -PSMARTCONTROL_TURN_USERNAME="$SMARTCONTROL_TURN_USERNAME" -PSMARTCONTROL_TURN_CREDENTIAL="$SMARTCONTROL_TURN_CREDENTIAL" -PSMARTCONTROL_API_BASE_URL="$SMARTCONTROL_API_BASE_URL"

  cross-platform-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Verify cross-platform integration surfaces
        run: node scripts/platform-integration-check.js

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: iOS simulator build
        env:
          SMARTCONTROL_IOS_FIREBASE_CONFIG: ${{ secrets.SMARTCONTROL_IOS_FIREBASE_CONFIG }}
        run: |
          if [ -n "$SMARTCONTROL_IOS_FIREBASE_CONFIG" ]; then
            printf '%s' "$SMARTCONTROL_IOS_FIREBASE_CONFIG" > ios/SmartControl/GoogleService-Info.plist
          fi
          xcodebuild -project ios/SmartControl.xcodeproj -scheme SmartControl -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' -configuration Debug CODE_SIGNING_ALLOWED=NO build
