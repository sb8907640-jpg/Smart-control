name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: smart_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_control_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize Firebase config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        if: env.FIREBASE_GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build debug and release APKs
        env:
          SMARTCONTROL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SMARTCONTROL_GOOGLE_WEB_CLIENT_ID }}
          SMARTCONTROL_TURN_URLS: ${{ secrets.SMARTCONTROL_TURN_URLS }}
          SMARTCONTROL_TURN_USERNAME: ${{ secrets.SMARTCONTROL_TURN_USERNAME }}
          SMARTCONTROL_TURN_CREDENTIAL: ${{ secrets.SMARTCONTROL_TURN_CREDENTIAL }}
          SMARTCONTROL_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SMARTCONTROL_API_BASE_URL }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: gradle test assembleOwnerDebug assembleLiteDebug assembleFullDebug assembleOwnerRelease assembleLiteRelease assembleFullRelease -PSMARTCONTROL_GOOGLE_WEB_CLIENT_ID="$SMARTCONTROL_GOOGLE_WEB_CLIENT_ID" -PSMARTCONTROL_TURN_URLS="$SMARTCONTROL_TURN_URLS" -PSMARTCONTROL_TURN_USERNAME="$SMARTCONTROL_TURN_USERNAME" -PSMARTCONTROL_TURN_CREDENTIAL="$SMARTCONTROL_TURN_CREDENTIAL" -PSMARTCONTROL_API_BASE_URL="$SMARTCONTROL_API_BASE_URL"

      - name: Verify PostgreSQL backend code
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smart_control_test
          PG_SSL: "false"
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run migrate
          npm test

      - name: Verify realtime and Firebase backend modules
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check src/server.js
          grep -q '"socket.io"' package.json
          grep -q 'new Server(httpServer' src/server.js
          grep -q '/api/notifications/register' src/app.js
          grep -q '/api/config' src/app.js

      - name: Verify Node.js Express backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smart_control_test
          PG_SSL: "false"
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run migrate
          npm test
          node -e "require('./src/db'); require('./src/postgres-api'); console.log('postgres modules ok')"

      - name: Validate Firebase Functions
        shell: bash
        run: |
          set +e
          {
            echo "Node:"
            node --version
            echo "index.js:"
            node --check functions/index.js
            index_status=$?
            echo "index_status=$index_status"
            echo "billing.js:"
            node --check functions/billing.js
            billing_status=$?
            echo "billing_status=$billing_status"
            echo "masterCatalog.js:"
            node -e "const c=require('./functions/spec/masterCatalog'); if(c.TABLES.length < 42 || c.API.length < 60) process.exit(1); console.log('tables='+c.TABLES.length+' api='+c.API.length)"
            catalog_status=$?
            echo "catalog_status=$catalog_status"
            echo "validation_status=$(( index_status || billing_status || catalog_status ))"
          } 2>&1 | tee functions-validation.log
          exit "$(grep '^validation_status=' functions-validation.log | cut -d= -f2)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-control-ci-diagnostics
          path: functions-validation.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: smart-control-apks
          path: |
            app/build/outputs/apk/**/*.apk
