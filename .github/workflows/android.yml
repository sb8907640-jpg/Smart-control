name: Android CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Materialize Firebase config
        if: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
      - run: gradle test
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smart-control-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
