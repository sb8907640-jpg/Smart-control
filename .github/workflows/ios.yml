name: iOS CI

on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator app
        run: |
          xcodebuild             -project ios/SmartControl.xcodeproj             -scheme SmartControl             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 15'             -configuration Debug             CODE_SIGNING_ALLOWED=NO             build
