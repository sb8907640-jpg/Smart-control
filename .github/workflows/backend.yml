name: Backend CI

on:
  push:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: smart_control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_control_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smart_control_test
          PG_SSL: "false"
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run migrate
          npm test
      - name: Build production container
        run: docker build -f backend/Dockerfile backend
